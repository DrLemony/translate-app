name: APK Derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk EkranCevirici.apk

      - name: Actions çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: EkranCevirici-apk
          path: EkranCevirici.apk

      - name: Releases sayfasına koy (tabletten direkt indirmek için)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ekran Çevirici v1.0.${{ github.run_number }}
          files: EkranCevirici.apk
